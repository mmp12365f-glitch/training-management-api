services:

  db:
    image: postgres:18

    env_file:
      - .env

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: running_bd

    volumes:
      - training-postgres-data:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  migrate:
    build: .

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: running_bd

    depends_on:
      db:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "alembic",
        "upgrade",
        "head"
      ]


  api:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: running_bd

    depends_on:
      db:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully


volumes:
  training-postgres-data:
    name: training-postgres-data